name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published advisories and CodeQL rules are picked up without a push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Known false positives (fake test keys) are listed by fingerprint in .gitleaksignore.
      - name: Scan
        env:
          GITLEAKS_VERSION: 8.30.1
          # From the release's gitleaks_8.30.1_checksums.txt; update both together.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # Only the history of the commit being checked: other branches (work in progress) are scanned on their own runs.
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="HEAD" .

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
