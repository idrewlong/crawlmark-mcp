# Reference for config/clients.yaml (CLIENTS_FILE). You don't need to copy this file.
#
# clients.yaml is crawlmark's client list. When Google is set up, domains found in
# Search Console and GA4 are added to it automatically. crawlmark never changes or
# removes what you write there: it only appends new domains and fills a missing
# gscProperty or ga4PropertyId. You can add clients by hand too, with or without
# Google (`crawlmark-cli clients add example.com`).
#
# Each entry is keyed by a name you pass as `client` (crawlmark uses the domain).
# Only `domain` is required. Tools also accept the domain in any URL or www. form.
# Manage competitors, tracked keywords, brand terms, area and niche with the MCP tools
# (add_competitors, add_keywords, add_brand_terms, set_client_profile, ...) or the CLI
# (`crawlmark-cli competitors add example.com rival.example`), or edit them here.

clients:
  # A discovered client with your additions. Unset fields use the defaults shown.
  example.com:
    domain: example.com
    name: Example Co # default: the GA4 property name, else the domain
    gscProperty: sc-domain:example.com # or a URL-prefix property, e.g. https://www.example.com/
    ga4PropertyId: "123456789" # Admin > Property details
    gtmAccountId: "6000000001" # Tag Manager account and container for gtm_audit: the numeric IDs in the Tag Manager URL
    gtmContainerId: "7000000001" # (/container/accounts/<account>/containers/<container>), or the public ID ("GTM-ABC1234", then leave
    #                              gtmAccountId out). Default: found by matching the container's domain list to this client; set it
    #                              to pin one when several match
    ga4Hostnames: # default: [example.com, www.example.com]. GA4 numbers count only these hostnames (staging, localhost and old domains are left out)
      - example.com # an exact host
      - www.example.com
      - shop.example.com
      #- "*.example.com" # any subdomain (not example.com itself)
      #- "*" # alone: no hostname filter at all
    gscExcludeQueries: # default: none. Search Console queries left out of totals and query lists
      - example login # a plain string matches the whole query exactly (ignoring case and extra spaces)
      - "/^site:example\\.com/" # /.../ is an RE2 regular expression (case-insensitive; no lookarounds or backreferences)
    locationCode: 2840 # DataForSEO market; default DEFAULT_LOCATION_CODE (2840 = United States)
    languageCode: en # default DEFAULT_LANGUAGE_CODE
    area: Austin,Texas,United States # DataForSEO location_name for local searches (suggest_competitors); default: use locationCode
    niche: emergency plumber # what the client does, in a few words; first seed keyword for suggest_competitors
    brandTerms: # default: none. Names people search for this brand; used to split branded from non-branded queries
      - example co # adds to, never replaces, the built-in matching on the domain name, client name and GA4 name
      - term: ex co # or an object; suggest_brand_terms and add_brand_terms write this form
        source: auto-gsc # manual, suggested (confirmed by you), auto-gsc or auto-dataforseo (inferred automatically)
        addedAt: 2026-10-12
    competitors: # default: none. A domain, or an object; URLs and www. forms are saved as the bare domain
      - competitor.example
      - domain: other-competitor.example
        note: Same neighbourhood # optional
        source: suggested # manual (default) or suggested (from suggest_competitors, confirmed by you)
        addedAt: 2026-10-12 # set by the tools and CLI
    trackedKeywords: # default: none. A keyword, or an object with the same optional fields; saved lowercase
      - example keyword
      - keyword: emergency plumber near me
        source: manual
        addedAt: 2026-10-12
    keyPages: # pages run_audit checks; default: the homepage
      - https://example.com/
      - https://example.com/contact/
    monthlyBudgetUsd: 5 # DataForSEO cap in USD; default DEFAULT_CLIENT_MONTHLY_BUDGET_USD
    dataProvider: ahrefs # dataforseo, ahrefs or semrush: whose paid keyword, ranking, competitor and backlink data; default SEO_DATA_PROVIDER
    country: US # ISO alpha-2 market for Ahrefs and Semrush; default: from a country-level locationCode
    bingSite: https://www.example.com/ # the Bing Webmaster Tools site bing_report reads; default: the verified site with this domain
    gbpPlaceId: ChIJexamplePlaceId000001 # the confirmed Google Business Profile (from local_profile; save it only after checking the match)
    ahrefsSiteAuditProject: "1234567" # an existing Ahrefs Site Audit project (app.ahrefs.com/site-audit/<id>) for technical_issues; default: matched by domain
    semrushProject: "7654321" # an existing Semrush project with Site Audit for technical_issues; default: matched by domain
    monthlyUnits: # Ahrefs/Semrush API unit caps; default DEFAULT_CLIENT_MONTHLY_AHREFS_UNITS / _SEMRUSH_UNITS
      ahrefs: 20000
      semrush: 5000

  # A manual client with no Google access: DataForSEO, Lighthouse and axe still work.
  example.org:
    domain: example.org

  # Hidden: never listed, and discovery won't add it back.
  example.net:
    domain: example.net
    ignore: true
